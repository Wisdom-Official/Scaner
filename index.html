<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store Inventory Pro & Barcode Scanner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    #reader video { border-radius: 0.75rem; object-fit: cover; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-12">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 sticky top-0 z-30 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-indigo-600 p-2.5 rounded-xl text-white shadow-lg shadow-indigo-500/30">
          <i class="fa-solid fa-boxes-stacked text-xl"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight">Store Ops <span class="text-xs px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">PRO</span></h1>
          <p class="text-xs text-slate-400">Inventory & Scanner Suite</p>
        </div>
      </div>
      <button onclick="openScannerModal()" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-4 py-2 rounded-xl transition duration-200 shadow-lg shadow-indigo-600/25 active:scale-95">
        <i class="fa-solid fa-qrcode"></i>
        <span>Scan Item</span>
      </button>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8">
    
    <!-- Stats Row -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
      <div class="glass-card p-5 rounded-2xl flex items-center justify-between">
        <div>
          <p class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Total SKUs</p>
          <h3 id="statTotal" class="text-2xl font-bold mt-1 text-white">0</h3>
        </div>
        <div class="w-12 h-12 rounded-xl bg-slate-800 flex items-center justify-center text-indigo-400 text-lg">
          <i class="fa-solid fa-box font-bold"></i>
        </div>
      </div>
      <div class="glass-card p-5 rounded-2xl flex items-center justify-between">
        <div>
          <p class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Low Stock Items</p>
          <h3 id="statLow" class="text-2xl font-bold mt-1 text-amber-400">0</h3>
        </div>
        <div class="w-12 h-12 rounded-xl bg-slate-800 flex items-center justify-center text-amber-400 text-lg">
          <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
      </div>
      <div class="glass-card p-5 rounded-2xl flex items-center justify-between">
        <div>
          <p class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Total Value</p>
          <h3 id="statValue" class="text-2xl font-bold mt-1 text-emerald-400">₹0</h3>
        </div>
        <div class="w-12 h-12 rounded-xl bg-slate-800 flex items-center justify-center text-emerald-400 text-lg">
          <i class="fa-solid fa-indian-rupee-sign"></i>
        </div>
      </div>
    </div>

    <!-- Main Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- Item Add / Edit Form -->
      <div class="lg:col-span-1">
        <div class="glass-card p-6 rounded-2xl border border-slate-800">
          <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
            <i class="fa-solid fa-pen-to-square text-indigo-400"></i> Manage Item
          </h2>
          <form id="itemForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1">Barcode / SKU</label>
              <div class="flex gap-2">
                <input type="text" id="itemBarcode" required placeholder="Scan or enter code" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                <button type="button" onclick="openScannerModal()" class="px-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-slate-300 transition">
                  <i class="fa-solid fa-barcode"></i>
                </button>
              </div>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1">Item Name</label>
              <input type="text" id="itemName" required placeholder="e.g. Wireless Mouse" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Price (₹)</label>
                <input type="number" step="0.01" id="itemPrice" required placeholder="0.00" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Quantity</label>
                <input type="number" id="itemQty" required placeholder="0" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
              </div>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1">Category</label>
              <select id="itemCategory" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                <option value="Electronics">Electronics</option>
                <option value="Groceries">Groceries</option>
                <option value="Apparel">Apparel</option>
                <option value="General">General</option>
              </select>
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-xl transition duration-200 mt-2 shadow-lg shadow-indigo-600/20">
              Save Inventory Item
            </button>
          </form>
        </div>
      </div>

      <!-- Inventory Table -->
      <div class="lg:col-span-2">
        <div class="glass-card rounded-2xl border border-slate-800 overflow-hidden">
          <div class="p-5 border-b border-slate-800 flex flex-wrap items-center justify-between gap-4">
            <h2 class="text-lg font-semibold flex items-center gap-2">
              <i class="fa-solid fa-list text-indigo-400"></i> Store Items
            </h2>
            <input type="text" id="searchInput" oninput="renderTable()" placeholder="Search by name or code..." class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-indigo-500 w-full sm:w-64">
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs">
              <thead class="bg-slate-900/50 text-slate-400 border-b border-slate-800 uppercase tracking-wider font-semibold">
                <tr>
                  <th class="py-3 px-4">Barcode</th>
                  <th class="py-3 px-4">Item Name</th>
                  <th class="py-3 px-4">Category</th>
                  <th class="py-3 px-4">Price</th>
                  <th class="py-3 px-4">Qty</th>
                  <th class="py-3 px-4 text-right">Actions</th>
                </tr>
              </thead>
              <tbody id="inventoryBody" class="divide-y divide-slate-800/60 text-slate-200">
                <!-- Rendered dynamically -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Scanner Modal Overlay -->
  <div id="scannerModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="glass-card rounded-2xl border border-slate-700 w-full max-w-md p-6 relative shadow-2xl">
      <button onclick="closeScannerModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <h3 class="text-lg font-bold mb-1 flex items-center gap-2">
        <i class="fa-solid fa-camera text-indigo-400"></i> Scan Barcode / QR Code
      </h3>
      <p class="text-xs text-slate-400 mb-4">Point your device camera at the barcode</p>
      
      <div id="reader" class="w-full overflow-hidden bg-slate-900 rounded-xl border border-slate-800"></div>

      <div class="mt-4 flex gap-2">
        <button onclick="closeScannerModal()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-2 rounded-xl text-xs transition">
          Cancel
        </button>
      </div>
    </div>
  </div>

  <script>
    let inventory = JSON.parse(localStorage.getItem('store_inventory')) || [
      { barcode: '8901030800001', name: 'Wireless Headphones', price: 2999, qty: 12, category: 'Electronics' },
      { barcode: '8901030800002', name: 'Organic Green Tea', price: 450, qty: 3, category: 'Groceries' }
    ];

    let html5QrcodeScanner = null;

    function saveInventory() {
      localStorage.setItem('store_inventory', JSON.stringify(inventory));
      renderTable();
      updateStats();
    }

    function renderTable() {
      const tbody = document.getElementById('inventoryBody');
      const query = document.getElementById('searchInput').value.toLowerCase();
      tbody.innerHTML = '';

      const filtered = inventory.filter(i => 
        i.name.toLowerCase().includes(query) || i.barcode.toLowerCase().includes(query)
      );

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-slate-500">No store items found</td></tr>`;
        return;
      }

      filtered.forEach((item, index) => {
        const isLowStock = item.qty < 5;
        tbody.innerHTML += `
          <tr class="hover:bg-slate-900/40 transition">
            <td class="py-3 px-4 font-mono text-indigo-300">${item.barcode}</td>
            <td class="py-3 px-4 font-medium">${item.name}</td>
            <td class="py-3 px-4"><span class="px-2 py-0.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700">${item.category}</span></td>
            <td class="py-3 px-4 font-semibold text-emerald-400">₹${parseFloat(item.price).toFixed(2)}</td>
            <td class="py-3 px-4">
              <span class="${isLowStock ? 'text-amber-400 font-bold' : ''}">${item.qty}</span>
            </td>
            <td class="py-3 px-4 text-right space-x-2">
              <button onclick="editItem('${item.barcode}')" class="text-slate-400 hover:text-indigo-400 transition"><i class="fa-solid fa-pen"></i></button>
              <button onclick="deleteItem('${item.barcode}')" class="text-slate-400 hover:text-rose-400 transition"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>
        `;
      });
    }

    function updateStats() {
      document.getElementById('statTotal').innerText = inventory.length;
      document.getElementById('statLow').innerText = inventory.filter(i => i.qty < 5).length;
      const totalVal = inventory.reduce((sum, i) => sum + (i.price * i.qty), 0);
      document.getElementById('statValue').innerText = '₹' + totalVal.toLocaleString('en-IN');
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const barcode = document.getElementById('itemBarcode').value.trim();
      const name = document.getElementById('itemName').value.trim();
      const price = parseFloat(document.getElementById('itemPrice').value);
      const qty = parseInt(document.getElementById('itemQty').value);
      const category = document.getElementById('itemCategory').value;

      const idx = inventory.findIndex(i => i.barcode === barcode);
      if (idx > -1) {
        inventory[idx] = { barcode, name, price, qty, category };
      } else {
        inventory.push({ barcode, name, price, qty, category });
      }

      saveInventory();
      document.getElementById('itemForm').reset();
    }

    function editItem(barcode) {
      const item = inventory.find(i => i.barcode === barcode);
      if (!item) return;
      document.getElementById('itemBarcode').value = item.barcode;
      document.getElementById('itemName').value = item.name;
      document.getElementById('itemPrice').value = item.price;
      document.getElementById('itemQty').value = item.qty;
      document.getElementById('itemCategory').value = item.category;
    }

    function deleteItem(barcode) {
      inventory = inventory.filter(i => i.barcode !== barcode);
      saveInventory();
    }

    function openScannerModal() {
      document.getElementById('scannerModal').classList.remove('hidden');
      html5QrcodeScanner = new Html5Qrcode("reader");
      html5QrcodeScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 150 } },
        (decodedText) => {
          onScanSuccess(decodedText);
        },
        (errorMessage) => { /* scanning failures */ }
      ).catch(err => {
        alert("Camera permission denied or not supported.");
        closeScannerModal();
      });
    }

    function closeScannerModal() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          html5QrcodeScanner.clear();
          document.getElementById('scannerModal').classList.add('hidden');
        }).catch(() => {
          document.getElementById('scannerModal').classList.add('hidden');
        });
      } else {
        document.getElementById('scannerModal').classList.add('hidden');
      }
    }

    function onScanSuccess(code) {
      closeScannerModal();
      document.getElementById('itemBarcode').value = code;
      
      const existingItem = inventory.find(i => i.barcode === code);
      if (existingItem) {
        editItem(code);
      } else {
        document.getElementById('itemName').focus();
      }
    }

    // Init
    renderTable();
    updateStats();
  </script>
</body>
</html>
